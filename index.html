<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程名称 - 实验指导与资源中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            scroll-behavior: smooth;
        }
        .lab-card-done {
            border-left: 4px solid #2563eb;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .lab-card-todo {
            opacity: 0.6;
            filter: grayscale(0.5);
            background: #f8fafc;
        }
        .material-card:hover {
            transform: translateY(-3px);
            transition: all 0.3s ease;
        }
        .supp-link:hover {
            background-color: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }
        /* 限制标题行数，保持整齐 */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- 顶部导航 -->
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 p-1.5 rounded-lg">
                        <i class="fas fa-graduation-cap text-white text-xl"></i>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-slate-800">实验教学资源库</span>
                </div>
                <div class="hidden md:flex space-x-8 text-sm font-semibold">
                    <a href="#intro" class="text-slate-600 hover:text-blue-600 transition">概览</a>
                    <a href="#labs" class="text-slate-600 hover:text-blue-600 transition">实验指导书</a>
                    <a href="#materials" class="text-slate-600 hover:text-blue-600 transition">通用材料</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 英雄页部分 -->
    <header id="intro" class="relative py-20 bg-blue-700 text-white overflow-hidden">
        <div class="absolute inset-0 opacity-10">
            <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                <circle cx="10" cy="10" r="30" fill="white"/>
                <circle cx="90" cy="80" r="40" fill="white"/>
            </svg>
        </div>
        <div class="max-w-7xl mx-auto px-4 text-center relative z-10">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-6">数字信号处理与系统实验</h1>
            <p class="text-lg text-blue-100 max-w-3xl mx-auto leading-relaxed">
                欢迎访问本课程资源中心。这里提供全学期 32 个实验环节的详细指导书、配套数据及环境配置脚本。
                所有材料均可在线预览或下载。
            </p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        
        <!-- 实验列表部分 -->
        <section id="labs" class="mb-24">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 border-b border-slate-200 pb-5 gap-4">
                <h2 class="text-2xl font-bold flex items-center gap-3">
                    <i class="fas fa-book text-blue-600"></i> 实验指导计划 (1-32)
                </h2>
                <div class="flex gap-5 text-sm font-medium">
                    <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-600"></span> 已发布</span>
                    <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-300"></span> 编写中</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="lab-container">
                <!-- 由 JavaScript 渲染 -->
            </div>
        </section>

        <!-- 通用材料部分 -->
        <section id="materials" class="mb-20">
            <div class="flex items-center justify-between mb-10 border-b border-slate-200 pb-5">
                <h2 class="text-2xl font-bold flex items-center gap-3">
                    <i class="fas fa-folder-tree text-orange-500"></i> 通用教学资源
                </h2>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="material-container">
                <!-- 由 JavaScript 渲染 -->
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-slate-900 text-slate-400 py-16">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <div class="flex justify-center gap-6 mb-6 text-2xl">
                <a href="#" class="hover:text-white transition"><i class="fab fa-github"></i></a>
                <a href="#" class="hover:text-white transition"><i class="fas fa-envelope"></i></a>
            </div>
            <p class="text-sm">© 2024 课程管理教学团队</p>
            <p class="text-[10px] mt-2 opacity-50 uppercase tracking-widest">Hosted on GitHub Pages</p>
        </div>
    </footer>

    <script>
        /**
         * ==========================================
         * 1. 实验数据配置中心 (请在此处维护文件信息)
         * ==========================================
         * id: 实验编号
         * title: 页面显示的实验中文名
         * file: 在 labs/ 文件夹下的真实 PDF 文件名
         * supplements: 该实验特有的补充材料，指向 materials/ 文件夹
         */
        const completedLabs = [
    { 
        id: 1, 
        title: "采样详细指导", 
        file: "实验01采样详细指导书.pdf",
        supplements: [
            { name: "参考代码", file: "experiment1.ipynb" },
            { name: "更新", file: "exp1_update.docx" }
        ]
    },
    { 
        id: 2, 
        title: "可视化详细指导", 
        file: "实验02可视化详细指导书.pdf",
        supplements: [
            { name: "参考代码", file: "experiments.ipynb" }
             { name: "更新", file: "exp2_update.docx" }
        ]
    },
    { 
        id: 3, 
        title: "信号的统计肖像", 
        file: "实验 03 信号的统计肖像 - 实验指导书.pdf",
        supplements: [] 
    },
    { 
        id: 4, 
        title: "滑动窗口与移动平均", 
        file: "实验 04 滑动窗口与移动平均 - 实验指导书.pdf",
        supplements: [
            { name: "算法演示(ipynb)", file: "moving_avg_demo.ipynb" }
        ]
    },
    { 
        id: 5, 
        title: "信号归一化与缩放", 
        file: "实验 05 信号归一化与缩放 - 实验指导书.pdf", 
        supplements: [] 
    },
    { 
        id: 6, 
        title: "互相关检测", 
        file: "实验 06 互相关检测 - 实验指导书.pdf", 
        supplements: [] 
    },
    { 
        id: 7, 
        title: "异常值剔除", 
        file: "实验 07 异常值剔除 - 实验指导书.pdf", 
        supplements: [] 
    },
    { 
        id: 8, 
        title: "初探数据库", 
        file: "实验 08 初探数据库 - 实验指导书.pdf", 
        supplements: [] 
    }
];

        /**
         * ==========================================
         * 2. 通用补充材料配置 (页面底部的资源区)
         * ==========================================
         */
        const generalMaterials = [
            { 
                name: "课程教学大纲", 
                desc: "包含教学进度安排、学分分布及详细的考核评价准则。", 
                icon: "fa-file-invoice", 
                color: "text-blue-600",
                bg: "bg-blue-50",
                link: "materials/syllabus.pdf",
                type: "PDF"
            },
            { 
                name: "实验环境一键安装包", 
                desc: "针对不同系统的 Python 环境及依赖库集成安装脚本。", 
                icon: "fa-box-open", 
                color: "text-emerald-600",
                bg: "bg-emerald-50",
                link: "materials/env_setup.zip",
                type: "ZIP"
            },
            { 
                name: "推荐阅读参考书目", 
                desc: "精选的数字信号处理理论参考教材及学术论文集。", 
                icon: "fa-book-open", 
                color: "text-amber-600",
                bg: "bg-amber-50",
                link: "materials/references.pdf",
                type: "PDF"
            }
        ];

        // ------------------------------------------
        // 渲染引擎 (不需要改动此部分逻辑)
        // ------------------------------------------

        const labContainer = document.getElementById('lab-container');
        
        for (let i = 1; i <= 32; i++) {
            const config = completedLabs.find(l => l.id === i);
            const isDone = !!config;
            const labNum = i.toString().padStart(2, '0');
            const card = document.createElement('div');
            
            if (isDone) {
                // 处理专属附件
                let supplementsHtml = '';
                if (config.supplements && config.supplements.length > 0) {
                    supplementsHtml = `
                        <div class="mt-4 pt-3 border-t border-slate-100">
                            <span class="text-[10px] text-slate-400 font-bold uppercase block mb-2 tracking-tight">实验附件:</span>
                            <div class="flex flex-wrap gap-1.5">
                                ${config.supplements.map(s => {
                                    // 根据后缀识别图标
                                    const ext = s.file.split('.').pop().toLowerCase();
                                    let icon = 'fa-file-alt';
                                    if(ext === 'ipynb') icon = 'fa-terminal';
                                    if(ext === 'zip' || ext === 'rar') icon = 'fa-file-archive';
                                    if(ext === 'docx' || ext === 'doc') icon = 'fa-file-word';
                                    
                                    return `
                                        <a href="materials/${encodeURIComponent(s.file)}" download class="supp-link flex items-center gap-1 px-2 py-1 bg-slate-50 text-slate-500 text-[10px] rounded border border-slate-200 transition">
                                            <i class="fas ${icon}"></i> ${s.name}
                                        </a>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }

                card.className = "bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition lab-card-done";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-bold rounded uppercase">Lab ${labNum}</span>
                            <i class="fas fa-check-circle text-blue-500"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 mb-4 line-clamp-2 h-12 leading-tight">${config.title}</h3>
                        <div class="flex gap-2">
                            <a href="labs/${encodeURIComponent(config.file)}" target="_blank" class="flex-1 text-center py-2 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 transition">阅读 PDF</a>
                            <a href="labs/${encodeURIComponent(config.file)}" download class="w-10 flex items-center justify-center bg-slate-100 text-slate-500 rounded-lg hover:bg-slate-200 transition">
                                <i class="fas fa-download text-xs"></i>
                            </a>
                        </div>
                    </div>
                    ${supplementsHtml}
                `;
            } else {
                card.className = "p-6 rounded-2xl border border-dashed border-slate-300 lab-card-todo flex flex-col justify-center items-center text-center h-full min-h-[160px]";
                card.innerHTML = `
                    <span class="text-[10px] font-bold text-slate-400 uppercase mb-2">Lab ${labNum}</span>
                    <h3 class="font-bold text-slate-400 text-sm mb-4 tracking-wide">实验指导筹备中</h3>
                    <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center">
                        <i class="fas fa-hourglass-half text-slate-300 text-sm"></i>
                    </div>
                `;
            }
            labContainer.appendChild(card);
        }

        // 渲染通用材料
        const materialContainer = document.getElementById('material-container');
        generalMaterials.forEach(item => {
            const mCard = document.createElement('div');
            mCard.className = "bg-white p-6 rounded-3xl shadow-sm border border-slate-100 material-card flex flex-col items-start";
            mCard.innerHTML = `
                <div class="w-14 h-14 ${item.bg} ${item.color} rounded-2xl flex items-center justify-center mb-6">
                    <i class="fas ${item.icon} text-2xl"></i>
                </div>
                <div class="mb-2 flex items-center gap-2">
                    <h3 class="font-bold text-lg text-slate-800">${item.name}</h3>
                    <span class="text-[9px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter">${item.type}</span>
                </div>
                <p class="text-slate-500 text-sm mb-6 leading-relaxed flex-grow">${item.desc}</p>
                <a href="${item.link}" target="_blank" class="inline-flex items-center text-sm font-bold text-blue-600 hover:text-blue-700 gap-1 group">
                    立即获取 <i class="fas fa-arrow-right text-[10px] group-hover:translate-x-1 transition-transform"></i>
                </a>
            `;
            materialContainer.appendChild(mCard);
        });
    </script>
</body>
</html>
