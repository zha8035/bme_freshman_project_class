<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程名称 - 实验指导与资源中心集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            scroll-behavior: smooth;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .lab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- 导航栏 -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <i class="fas fa-graduation-cap text-blue-600 text-2xl"></i>
                    <span class="font-bold text-xl tracking-tight">高级课程资源库</span>
                </div>
                <div class="hidden md:flex space-x-8 text-sm font-medium">
                    <a href="#intro" class="hover:text-blue-600 transition">课程概览</a>
                    <a href="#labs" class="hover:text-blue-600 transition">实验指导</a>
                    <a href="#materials" class="hover:text-blue-600 transition">补充材料</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 英雄页 -->
    <header id="intro" class="relative py-20 bg-blue-600 text-white overflow-hidden">
        <div class="absolute inset-0 opacity-10">
            <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M0 100 C 20 0 50 0 100 100 Z" fill="white"></path>
            </svg>
        </div>
        <div class="max-w-7xl mx-auto px-4 text-center relative z-10">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-6">面向未来的实验教学课程</h1>
            <p class="text-lg md:text-xl text-blue-100 max-w-2xl mx-auto mb-8">
                本页面汇集了本学期全部 32 个实验指导书及相关辅助教学材料，旨在为学生提供一站式的学习支持。
            </p>
            <div class="flex justify-center gap-4">
                <a href="#labs" class="bg-white text-blue-600 px-8 py-3 rounded-full font-semibold shadow-lg hover:bg-blue-50 transition">
                    立即开始实验
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-16">
        
        <!-- 实验指导书部分 -->
        <section id="labs" class="mb-20">
            <div class="flex items-center justify-between mb-10 border-b pb-4">
                <h2 class="text-3xl font-bold flex items-center gap-3">
                    <i class="fas fa-flask text-blue-500"></i> 实验指导书 (32)
                </h2>
                <span class="bg-blue-100 text-blue-600 text-xs font-bold px-3 py-1 rounded-full uppercase">PDF 下载</span>
            </div>

            <div class="lab-grid" id="lab-container">
                <!-- 由 JS 动态生成 32 个实验卡片以便维护 -->
            </div>
        </section>

        <!-- 补充材料部分 -->
        <section id="materials" class="mb-20">
            <div class="flex items-center justify-between mb-10 border-b pb-4">
                <h2 class="text-3xl font-bold flex items-center gap-3">
                    <i class="fas fa-folder-open text-orange-500"></i> 补充材料
                </h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 材料 1 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                    <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-lg flex items-center justify-center mb-4">
                        <i class="fas fa-file-powerpoint text-xl"></i>
                    </div>
                    <h3 class="font-bold text-lg mb-2">课程大纲 (Syllabus)</h3>
                    <p class="text-slate-500 text-sm mb-4">详细说明课程进度、评分标准及参考书目。</p>
                    <a href="materials/syllabus.pdf" target="_blank" class="text-blue-600 hover:underline text-sm font-medium">
                        查看详情 <i class="fas fa-arrow-right ml-1"></i>
                    </a>
                </div>

                <!-- 材料 2 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                    <div class="w-12 h-12 bg-green-100 text-green-600 rounded-lg flex items-center justify-center mb-4">
                        <i class="fas fa-code text-xl"></i>
                    </div>
                    <h3 class="font-bold text-lg mb-2">基础环境配置脚本</h3>
                    <p class="text-slate-500 text-sm mb-4">实验所需的自动化安装脚本及环境配置指南。</p>
                    <a href="materials/env_setup.zip" download class="text-blue-600 hover:underline text-sm font-medium">
                        下载 ZIP <i class="fas fa-download ml-1"></i>
                    </a>
                </div>

                <!-- 材料 3 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                    <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-lg flex items-center justify-center mb-4">
                        <i class="fas fa-video text-xl"></i>
                    </div>
                    <h3 class="font-bold text-lg mb-2">实验演示视频链接</h3>
                    <p class="text-slate-500 text-sm mb-4">精选各章节实验的重点难点视频演示。</p>
                    <a href="#" class="text-blue-600 hover:underline text-sm font-medium">
                        跳转播放列表 <i class="fas fa-external-link-alt ml-1"></i>
                    </a>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-slate-900 text-slate-400 py-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="mb-4">© 2024 课程名称. 由 GitHub Pages 托管.</p>
            <div class="flex justify-center space-x-6 text-xl">
                <a href="#" class="hover:text-white transition"><i class="fab fa-github"></i></a>
                <a href="#" class="hover:text-white transition"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // 动态生成 32 个实验卡片
        const container = document.getElementById('lab-container');
        
        for (let i = 1; i <= 32; i++) {
            const labNum = i.toString().padStart(2, '0');
            const card = document.createElement('div');
            card.className = "bg-white p-5 rounded-xl border border-slate-200 hover:border-blue-300 hover:shadow-lg transition group";
            
            card.innerHTML = `
                <div class="flex items-start justify-between">
                    <div>
                        <span class="text-xs font-bold text-blue-500 uppercase tracking-wider">Experiment</span>
                        <h3 class="font-bold text-lg text-slate-800 group-hover:text-blue-600 transition">实验 ${labNum}</h3>
                    </div>
                    <div class="text-slate-300 group-hover:text-blue-200">
                        <i class="fas fa-file-pdf text-2xl"></i>
                    </div>
                </div>
                <p class="text-slate-500 text-sm mt-2 mb-4">这是关于实验 ${i} 的简要描述或主题词。</p>
                <div class="flex gap-2">
                    <a href="labs/lab${labNum}.pdf" target="_blank" class="flex-1 text-center py-2 bg-slate-50 text-slate-700 text-xs font-bold rounded-lg hover:bg-blue-600 hover:text-white transition">
                        在线阅读
                    </a>
                    <a href="labs/lab${labNum}.pdf" download class="w-10 flex items-center justify-center bg-slate-50 text-slate-700 rounded-lg hover:bg-slate-200 transition">
                        <i class="fas fa-download text-xs"></i>
                    </a>
                </div>
            `;
            container.appendChild(card);
        }
    </script>
</body>
</html>
