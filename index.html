<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程名称 - 实验指导与资源中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            scroll-behavior: smooth;
        }
        .lab-card-done {
            border-left: 4px solid #2563eb;
        }
        .lab-card-todo {
            opacity: 0.6;
            filter: grayscale(0.5);
            background: #f8fafc;
        }
        .material-card:hover {
            transform: translateY(-2px);
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- 导航栏 -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <i class="fas fa-graduation-cap text-blue-600 text-2xl"></i>
                    <span class="font-bold text-xl tracking-tight">实验教学资源库</span>
                </div>
                <div class="hidden md:flex space-x-8 text-sm font-medium">
                    <a href="#intro" class="hover:text-blue-600 transition">课程概览</a>
                    <a href="#labs" class="hover:text-blue-600 transition">实验指导</a>
                    <a href="#materials" class="hover:text-blue-600 transition">补充材料</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 英雄页 -->
    <header id="intro" class="relative py-16 bg-blue-600 text-white overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 text-center relative z-10">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-4">面向未来的实验教学课程</h1>
            <p class="text-lg text-blue-100 max-w-2xl mx-auto mb-8">
                本页面包含全部 32 个实验教学环节。当前已有 8 个实验指导书及相关辅助材料完成更新。
            </p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        
        <!-- 实验指导书部分 -->
        <section id="labs" class="mb-20">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 border-b pb-4 gap-4">
                <h2 class="text-2xl font-bold flex items-center gap-3">
                    <i class="fas fa-list-ol text-blue-500"></i> 实验指导计划 (1-32)
                </h2>
                <div class="flex gap-4 text-sm font-medium">
                    <span class="flex items-center gap-1.5"><i class="fas fa-check-circle text-blue-500"></i> 已发布</span>
                    <span class="flex items-center gap-1.5"><i class="fas fa-clock text-slate-400"></i> 编写中</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="lab-container">
                <!-- 由 JS 根据下方配置动态生成 -->
            </div>
        </section>

        <!-- 补充材料部分 -->
        <section id="materials" class="mb-20">
            <div class="flex items-center justify-between mb-10 border-b pb-4">
                <h2 class="text-2xl font-bold flex items-center gap-3">
                    <i class="fas fa-folder-open text-orange-500"></i> 补充材料与参考资源
                </h2>
            </div>
            
            <!-- 补充材料容器 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="material-container">
                <!-- 由 JS 根据下方配置动态生成 -->
            </div>
        </section>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-12 text-center">
        <p class="text-sm">© 2024 课程管理团队 | 由 GitHub Pages 强力驱动</p>
        <p class="text-[10px] mt-2 opacity-50">最后更新时间：2024年</p>
    </footer>

    <script>
        /**
         * 1. 实验数据配置中心
         * 在此添加已完成的 PDF 文件名和显示标题
         */
       const completedLabs = [
    { id: 1, title: "采样详细指导", file: "实验01采样详细指导书.pdf" },
    { id: 2, title: "可视化详细指导", file: "实验02可视化详细指导书.pdf" },
    { id: 3, title: "信号的统计肖像", file: "实验 03 信号的统计肖像 - 实验指导书.pdf" },
    { id: 4, title: "滑动窗口与移动平均", file: "实验 04 滑动窗口与移动平均 - 实验指导书.pdf" },
    { id: 5, title: "信号归一化与缩放", file: "实验 05 信号归一化与缩放 - 实验指导书.pdf" },
    { id: 6, title: "互相关检测", file: "实验 06 互相关检测 - 实验指导书.pdf" },
    { id: 7, title: "异常值剔除", file: "实验 07 异常值剔除 - 实验指导书.pdf" },
    { id: 8, title: "初探数据库", file: "实验 08 初探数据库 - 实验指导书.pdf" }
];

        /**
         * 2. 补充材料配置中心
         * 如果有新材料（如课件、参考书），直接在这里添加
         */
        const materialsData = [
            { 
                name: "课程教学大纲", 
                desc: "详细列出学期进度、考核权重及实验目标说明。", 
                icon: "fa-file-invoice", 
                color: "text-blue-600",
                bg: "bg-blue-50",
                link: "materials/syllabus.pdf",
                type: "PDF"
            },
            { 
                name: "实验环境一键配置脚本", 
                desc: "包含 Python/C++ 环境依赖及相关库的安装包。", 
                icon: "fa-file-code", 
                color: "text-emerald-600",
                bg: "bg-emerald-50",
                link: "materials/env_setup.zip",
                type: "ZIP"
            },
            { 
                name: "数字信号处理参考教材", 
                desc: "本实验课程配套的理论参考书电子版（推荐阅读）。", 
                icon: "fa-book", 
                color: "text-orange-600",
                bg: "bg-orange-50",
                link: "materials/textbook.pdf",
                type: "PDF"
            }
        ];

        // 渲染实验指导书
        const labContainer = document.getElementById('lab-container');
        for (let i = 1; i <= 32; i++) {
            const labConfig = completedLabs.find(l => l.id === i);
            const isDone = !!labConfig;
            const labNum = i.toString().padStart(2, '0');
            const card = document.createElement('div');
            
            if (isDone) {
                card.className = "bg-white p-5 rounded-xl border border-slate-200 hover:shadow-md transition lab-card-done";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-bold rounded uppercase">Lab ${labNum}</span>
                        <i class="fas fa-check-circle text-blue-500"></i>
                    </div>
                    <h3 class="font-bold text-slate-800 mb-4 line-clamp-2 h-12">${labConfig.title}</h3>
                    <div class="flex gap-2">
                        <a href="labs/${encodeURIComponent(labConfig.file)}" target="_blank" class="flex-1 text-center py-2 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 transition">阅读</a>
                        <a href="labs/${encodeURIComponent(labConfig.file)}" download class="w-10 flex items-center justify-center bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 transition">
                            <i class="fas fa-download text-xs"></i>
                        </a>
                    </div>
                `;
            } else {
                card.className = "p-5 rounded-xl border border-dashed border-slate-300 lab-card-todo flex flex-col justify-center items-center text-center";
                card.innerHTML = `
                    <span class="text-[10px] font-bold text-slate-400 uppercase mb-2">Lab ${labNum}</span>
                    <h3 class="font-bold text-slate-400 text-sm mb-3">实验内容准备中</h3>
                    <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center">
                        <i class="fas fa-clock text-slate-300 text-xs"></i>
                    </div>
                `;
            }
            labContainer.appendChild(card);
        }

        // 渲染补充材料
        const materialContainer = document.getElementById('material-container');
        materialsData.forEach(item => {
            const card = document.createElement('div');
            card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-100 material-card";
            card.innerHTML = `
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-12 h-12 ${item.bg} ${item.color} rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas ${item.icon} text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800">${item.name}</h3>
                        <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-bold">${item.type}</span>
                    </div>
                </div>
                <p class="text-slate-500 text-sm mb-6 leading-relaxed">${item.desc}</p>
                <a href="${item.link}" target="_blank" class="inline-flex items-center text-sm font-semibold text-blue-600 hover:text-blue-700">
                    立即查看 <i class="fas fa-chevron-right ml-1 text-[10px]"></i>
                </a>
            `;
            materialContainer.appendChild(card);
        });
    </script>
</body>
</html>
